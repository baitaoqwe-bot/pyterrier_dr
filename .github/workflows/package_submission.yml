name: Package MSc submission

on:
  push:
    branches:
      - lora-decouple
    paths:
      - '.github/workflows/package_submission.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare source-code submission ZIP
        shell: bash
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf tests/fixtures/vaswani_tct.flex
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type d -name '.pytest_cache' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          zip -r MSc_project_3163950b.zip . -x 'MSc_project_3163950b.zip'

      - name: Upload submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSc_project_3163950b
          path: MSc_project_3163950b.zip
          retention-days: 7
